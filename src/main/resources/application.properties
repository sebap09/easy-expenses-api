spring.application.name=easy-expenses-api
spring.profiles.active=dev
#spring.profiles.include=h2
spring.profiles.include=postgresql

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/my-realm
spring.security.oauth2.resourceserver.jwt.audiences=easy-expenses-api

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.user=postgres
spring.flyway.password=admin
; flyway.schemas=app-db
spring.flyway.url=jdbc:postgresql://localhost:5432/easy-expenses-db
spring.flyway.locations=classpath:db/migration